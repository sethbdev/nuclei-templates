id: aws-access-secret-key-post-put

info:
  name: AWS Access/Secret Key Disclosure via POST/PUT
  author: reewardius
  severity: high
  description: |
    Detects AWS credentials in the response body of POST or PUT requests.
  tags: disclosure,aws,exposure,amazon
  metadata:
    verified: true
    max-request: 2

http:
  - id: aws-post
    method: POST
    path:
      - '{{BaseURL}}'
    body: "test=data"
    headers:
      Content-Type: application/x-www-form-urlencoded

    matchers:
      - type: dsl
        name: aws-key-post-leak
        dsl:
          - contains_any(to_lower(body), 'accesskeyid', 'secretaccesskey')
          - contains_any(to_lower(body), 'aws_access_key_id', 'aws_secret_access_key', 'aws_session_token')

  - id: aws-put
    method: PUT
    path:
      - '{{BaseURL}}'
    body: "test=data"
    headers:
      Content-Type: application/x-www-form-urlencoded

    matchers:
      - type: dsl
        name: aws-key-put-leak
        dsl:
          - contains_any(to_lower(body), 'accesskeyid', 'secretaccesskey')
          - contains_any(to_lower(body), 'aws_access_key_id', 'aws_secret_access_key', 'aws_session_token')
