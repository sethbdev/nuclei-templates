id: aws-access-secret-key

info:
  name: AWS Access/Secret Key Disclosure
  author: reewardius
  severity: high
  description: |
    Detects accidental exposure of AWS credentials such as `accessKeyId`, `secretAccessKey`, or `aws_access_key_id` in HTTP responses.
  tags: disclosure,aws,exposure,amazon
  metadata:
    verified: true
    max-request: 1

http:
  - id: aws-key-check
    method: GET
    path:
      - '{{BaseURL}}'

    matchers:
      - type: dsl
        name: aws-key-leak
        dsl:
          - contains_any(to_lower(body), 'accesskeyid', 'secretaccesskey')
          - contains_any(to_lower(body), 'aws_access_key_id', 'aws_secret_access_key', 'aws_session_token')
