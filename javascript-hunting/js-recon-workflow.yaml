id: js-recon-workflow

info:
  name: JavaScript Recon Workflow
  author: bughunter
  description: Chains JS discovery, filtering, accessibility, secrets scanning and optional GF/linkfinding.
  note: custom-tools/gf-linkfinder.yaml should be a local wrapper calling your gf or linkfinder.py results via custom script or HTTP bin.

workflows:
  - template: js-file-discovery.yaml
  - template: js-file-discovery-accessible.yaml
  - template: js-hash-fingerprint.yaml
  - template: js-secrets-detection.yaml
  - template: js-linkfinder-gf.yaml
  - template: js-linkfinder-headless.yaml
  - template: custom-tools/gf-linkfinder.yaml
  
