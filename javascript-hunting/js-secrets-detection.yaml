id: js-secrets-detection

info:
  name: JavaScript Secrets Detection
  author: bughunter
  severity: medium
  description: Scans JavaScript files for common secrets using regex patterns.
  tags: js, secrets, passive

requests:
  - method: GET
    path:
      - "{{BaseURL}}"

    extractors:
      - type: regex
        name: js-paths
        part: body
        regex:
          - "(?:src|href)=['\"](\/[^\"'>]{1,512}\\.js)['\"]"

  - method: GET
    path:
      - "{{BaseURL}}{{js-paths}}"

    matchers:
      - type: regex
        part: body
        regex:
          - "(?i)(api[_-]?key|secret|token)['\"]?\s*[:=]\s*['\"][A-Za-z0-9_\\-]{20,}"
          - "(?i)(access[_-]?token)['\"]?\s*[:=]\s*['\"][A-Za-z0-9_\\-]{20,}"
